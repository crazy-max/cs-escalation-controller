# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Bug Report
description: Report a bug
labels:
  - status/triage

body:
  - type: checkboxes
    attributes:
      label: Support guidelines
      description: Please read the support guidelines before proceeding.
      options:
        - label: I've read the [support guidelines](https://github.com/crazy-max/cs-escalation-controller/blob/main/.github/SUPPORT.md)
          required: true

  - type: checkboxes
    attributes:
      label: I've found a bug and checked that ...
      description: |
        Make sure that your request fulfills all of the following requirements. If one requirement cannot be satisfied, explain in detail why.
      options:
        - label: ... the documentation does not mention anything about my problem
        - label: ... there are no open or closed issues that are related to my problem

  - type: textarea
    attributes:
      label: Description
      description: |
        Please provide a brief description of the bug in 1-2 sentences.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
      description: |
        Please describe precisely what you'd expect to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behaviour
      description: |
        Please describe precisely what is actually happening.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Please describe the steps to reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    attributes:
      label: CrowdSec Escalation Controller version
    validations:
      required: true

  - type: input
    attributes:
      label: CrowdSec version
    validations:
      required: true

  - type: textarea
    attributes:
      label: Controller configuration
      description: |
        Include the YAML configuration and relevant CSEC_* overrides.
        Remove passwords and API keys. Include the dryRun setting.
      render: yaml
    validations:
      required: true

  - type: textarea
    attributes:
      label: Docker info
      description: |
        Output of `docker info`, if running with Docker.
      render: text

  - type: textarea
    attributes:
      label: Docker Compose config
      description: |
        Output of `docker compose config`, if applicable. Remove secrets.
      render: yaml

  - type: textarea
    attributes:
      label: Logs
      description: |
        Provide controller debug logs and relevant CrowdSec logs.
        Remove secrets and sensitive data before posting.
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional info
      description: |
        Please provide any additional information that seem useful.
