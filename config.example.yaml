# CSEC_* environment variables override file values, for example:
# CSEC_LAPI_PASSWORD, CSEC_DRYRUN=false, CSEC_ESCALATION_MULTIPLIER=2.

# CrowdSec Local API and registered machine credentials (not a bouncer API key).
lapi:
  url: http://crowdsec:8080
  username: cs-escalation-controller
  # Quote passwords to preserve their spelling. Values are not interpolated.
  # Alternatively, set CSEC_LAPI_PASSWORD in the container environment.
  password: "replace-me"
  # Alternatively, remove password and read it from a file.
  # passwordFile: /run/secrets/crowdsec_password

  # Dedicated bouncer key for this controller.
  # Alternatively, set CSEC_LAPI_BOUNCERAPIKEY in the container environment.
  # Required in scheduled mode; --once uses only machine credentials.
  bouncerAPIKey: "replace-me"
  # Alternatively, remove bouncerAPIKey and read it from a file.
  # bouncerAPIKeyFile: /run/secrets/crowdsec_bouncer_key

# Persistent per-IP history. Use a separate database for each LAPI and mode.
database: data/state.db

# Record escalation history without creating decisions.
# Switching to false requires a separate database from the dry-run database.
dryRun: true

# Synchronize at startup, then check the decisions stream on this schedule.
# Relevant changes trigger an active local ban alert fetch; idle checks do not.
# Failed cycles resynchronize on the next check. Overlaps are skipped.
# Supports five cron fields, an optional seconds field, and descriptors.
# Examples: "*/30 * * * * *", "*/5 * * * *", "CRON_TZ=UTC 0 * * * *".
schedule: "@every 30s"

# Total ban duration is baseDuration * multiplier^tier, capped at maxDuration.
# The multiplier is an integer of at least 2.
# Overlapping alerts share one offense; existing longer bans are never shortened.
# Defaults: 4h, 8h, 16h, 32h, 64h, 128h, 256h, 512h, then 720h.
# Go durations use hours: 720h = 30 days.
escalation:
  baseDuration: 4h
  multiplier: 2
  maxDuration: 720h

# Reset to the first tier after 30 quiet days. Time banned is not quiet time.
# Set to "0s" to retain repeat-offender history indefinitely.
resetAfter: 720h

# Exact scenario names to exclude from escalation (existing bans remain active).
excludeScenarios: []
